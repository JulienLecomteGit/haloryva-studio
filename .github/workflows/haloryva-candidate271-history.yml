name: Haloryva 2.7.1 history-height candidate
on:
  push:
    branches: ['haloryva-candidat-2.7.1-historique']
    paths: ['.github/workflows/haloryva-candidate271-history.yml', 'haloryva-ci/candidate271-history/**', 'livraison-2.7.1-historique/src/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile history-height candidate once and inspect metadata
        shell: powershell
        run: ./haloryva-ci/candidate271-history/Build-Candidate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1-file11-history-build
          path: ${{ runner.temp }}/haloryva-candidate271-history-build/
          retention-days: 90
          if-no-files-found: error
  about-captures:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        language: [fr, en, es]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-file11-history-build
          path: ${{ runner.temp }}/haloryva-candidate271-history-build/
      - name: Capture only About and history top and bottom
        shell: powershell
        run: ./haloryva-ci/candidate271-history/Run-Captures.ps1 -Language ${{ matrix.language }}
      - name: Deliver original capture bytes for read-only review
        if: always()
        shell: powershell
        run: ./haloryva-ci/candidate271-history/Emit-Captures.ps1 -Language ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1-file11-about-${{ matrix.language }}
          path: ${{ runner.temp }}/haloryva-candidate271-history-captures/${{ matrix.language }}/
          retention-days: 90
          if-no-files-found: error
