name: Haloryva preview.7 tool indicator and plural build
on:
  push:
    branches: ['haloryva-tests-preview7']
    paths: ['haloryva-ci/preview7/src/**', 'haloryva-ci/preview7/assets/**', 'haloryva-ci/preview7/languages/**', 'haloryva-ci/preview7/Build-Preview7.ps1', 'haloryva-ci/preview7/source-origin.json', '.github/workflows/haloryva-preview7-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated targeted preview
        shell: powershell
        run: ./haloryva-ci/preview7/Build-Preview7.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1-preview.7-build
          path: ${{ runner.temp }}/haloryva-preview7-build/
          retention-days: 30
          if-no-files-found: error
