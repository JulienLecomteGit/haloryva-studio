name: Haloryva preview.8 MSIX lifecycle and real startup API
on:
  push:
    branches: ['haloryva-tests-preview8']
    paths: ['haloryva-ci/preview8-msix/**', '.github/workflows/haloryva-preview8-msix.yml']
permissions:
  contents: read
  actions: read
jobs:
  msix:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.7-build
          run-id: 42957075701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-build/
      - uses: actions/download-artifact@v4
        with:
          name: preview8-targeted-evidence
          run-id: 43014257655
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview8-kit/
      - uses: actions/download-artifact@v4
        with:
          name: preview7-visual-es-off-evidence
          run-id: 43001652792
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-native/es/
      - name: Unsigned in-place updates and real packaged startup API
        shell: powershell
        run: ./haloryva-ci/preview8-msix/Run-Msix.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview8-msix-evidence
          path: ${{ runner.temp }}/haloryva-preview8-msix/
          retention-days: 30
