name: Haloryva preview.5 selected tool cycle
on:
  push:
    branches: ['haloryva-tests-preview5']
    paths: ['haloryva-ci/preview5/**', '.github/workflows/haloryva-preview5.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build preview.5 once
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build with preserved-source checks
        shell: powershell
        run: ./haloryva-ci/preview5/Build-Preview5.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.5-build
          path: ${{ runner.temp }}/haloryva-preview5-build/
          retention-days: 14
          if-no-files-found: error
  cycle:
    name: Tool cycle observer ${{ matrix.observer }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        observer: ['off', 'on']
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.5-build
          path: ${{ runner.temp }}/haloryva-preview5-build/
      - name: Native selection, buttons, held stroke and fresh-process reload
        shell: powershell
        run: ./haloryva-ci/preview5/Run-Cycle.ps1 -Observer ${{ matrix.observer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview5-cycle-${{ matrix.observer }}-evidence
          path: ${{ runner.temp }}/haloryva-preview5-cycle/${{ matrix.observer }}/
          retention-days: 14
