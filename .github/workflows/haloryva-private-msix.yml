name: Haloryva private MSIX 2.7.1 package only
on:
  push:
    branches: ['haloryva-msix-prive-2.7.1']
    paths: ['.github/workflows/haloryva-private-msix.yml', 'haloryva-ci/private-msix/**']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package unchanged EXE and verify only structure metadata extraction
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./haloryva-ci/private-msix/Pack.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1.0-private-MSIX-package
          path: ${{ runner.temp }}/haloryva-private-msix/
          retention-days: 90
          if-no-files-found: error
