name: Haloryva preview.8 consent and PNG WAV import only
on:
  push:
    branches: ['haloryva-tests-preview8-import']
    paths: ['haloryva-ci/preview8-import-ui/**', '.github/workflows/haloryva-preview8-import-ui.yml']
permissions:
  contents: read
  actions: read
jobs:
  import-ui:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview8-startup-ui-evidence
          run-id: 43017325667
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview8-frozen/
      - name: Real consent dialogs and synthetic classic profile import
        shell: powershell
        run: ./haloryva-ci/preview8-import-ui/Run-Import.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview8-import-ui-evidence
          path: ${{ runner.temp }}/preview8-import-ui/
          retention-days: 30
