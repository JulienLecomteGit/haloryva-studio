name: Haloryva preview.3 Studio smoothing assisted shapes
on:
  push:
    branches: ['haloryva-tests-preview3']
    paths: ['haloryva-ci/preview3-studio/**', '.github/workflows/haloryva-preview3-studio.yml']
permissions:
  contents: read
  actions: read
jobs:
  recipe:
    strategy:
      fail-fast: false
      matrix:
        suite: [studio, smoothing, assisted]
    name: ${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.3-build
          run-id: 42931395281
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview3-build/
      - name: Preserved preview.3 - ${{ matrix.suite }}
        shell: powershell
        run: ./haloryva-ci/preview3-studio/Run-Studio.ps1 -Suite ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview3-studio-${{ matrix.suite }}-evidence
          path: ${{ runner.temp }}/haloryva-preview3-studio/${{ matrix.suite }}/
          retention-days: 14
