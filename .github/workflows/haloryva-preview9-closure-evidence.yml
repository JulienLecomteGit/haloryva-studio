name: Haloryva preview.9 existing closure evidence only
on:
  push:
    branches: ['haloryva-preparation-exe-preview9']
    paths: ['.github/workflows/haloryva-preview9-closure-evidence.yml', 'preparation-exe-preview9-20261111/Read-ExistingArchives.ps1']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing archives without running Haloryva
        shell: powershell
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./preparation-exe-preview9-20261111/Read-ExistingArchives.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview9-closure-existing-inventory
          path: ${{ runner.temp }}/preview9-closure-existing/archive-inventory.json
          retention-days: 30
