name: Haloryva preview.7 targeted tool indicator, plurals and scroll capture
on:
  push:
    branches: ['haloryva-tests-preview7']
    paths: ['haloryva-ci/preview7-validation/**', '.github/workflows/haloryva-preview7-validation.yml']
permissions:
  contents: read
  actions: read
jobs:
  visual:
    name: Visual ${{ matrix.language }} observer ${{ matrix.observer }}
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        language: ['fr', 'en', 'es']
        observer: ['off', 'on']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.7-build
          run-id: 42957075701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-build/
      - name: Targeted tool indicator, plurals, scroll areas and restart
        shell: powershell
        run: ./haloryva-ci/preview7-validation/Run-Visual.ps1 -Language ${{ matrix.language }} -Observer ${{ matrix.observer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview7-visual-${{ matrix.language }}-${{ matrix.observer }}-evidence
          path: ${{ runner.temp }}/haloryva-preview7-visual/${{ matrix.language }}-${{ matrix.observer }}/
          retention-days: 30
