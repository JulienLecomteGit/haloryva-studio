name: Haloryva preview.5 persisted cycle reload
on:
  push:
    branches: ['haloryva-tests-preview5']
    paths: ['haloryva-ci/preview5-reload/**', '.github/workflows/haloryva-preview5-reload.yml']
permissions:
  contents: read
  actions: read
jobs:
  reload:
    name: Reload persisted cycle observer ${{ matrix.observer }}
    strategy:
      fail-fast: false
      matrix:
        observer: ['off', 'on']
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.5-build
          run-id: 42944347258
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview5-build/
      - uses: actions/download-artifact@v4
        with:
          name: preview5-cycle-${{ matrix.observer }}-evidence
          run-id: 42944347258
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview5-saved-cycle/
      - name: Reload exact saved profile in a fresh isolated process
        shell: powershell
        run: ./haloryva-ci/preview5-reload/Run-Reload.ps1 -Observer ${{ matrix.observer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview5-reload-${{ matrix.observer }}-evidence
          path: ${{ runner.temp }}/haloryva-preview5-reload/${{ matrix.observer }}/
          retention-days: 14
