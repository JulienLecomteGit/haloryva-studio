name: Haloryva preview.5 MSIX lifecycle and selected tools
on:
  push:
    branches: ['haloryva-tests-preview5-msix']
    paths: ['haloryva-ci/preview5-msix/**', '.github/workflows/haloryva-preview5-msix.yml']
permissions:
  contents: read
  actions: read
jobs:
  msix-windows11:
    name: Preserved preview.5 MSIX on Windows 11
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.5-build
          run-id: 42944347258
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview5-build/
      - name: Package, install, activate, persist tools, stop and remove
        shell: powershell
        run: ./haloryva-ci/preview5-msix/Run-Msix.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview5-msix-evidence
          path: ${{ runner.temp }}/haloryva-preview5-msix/
          retention-days: 14
