name: Haloryva preview.3 remaining tools history export
on:
  push:
    branches: ['haloryva-tests-preview3']
    paths: ['haloryva-ci/preview3-tools/**', '.github/workflows/haloryva-preview3-tools.yml']
permissions:
  contents: read
  actions: read
jobs:
  tools-history-export:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.3-build
          run-id: 42931395281
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview3-build/
      - name: Preserved preview.3 - remaining tools, undo redo and PNG export
        shell: powershell
        run: ./haloryva-ci/preview3-tools/Run-Tools.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview3-tools-history-export-evidence
          path: ${{ runner.temp }}/haloryva-preview3-tools/
          retention-days: 14
