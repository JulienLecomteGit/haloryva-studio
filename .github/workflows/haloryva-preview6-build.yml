name: Haloryva preview.6 localized build
on:
  push:
    branches: ['haloryva-tests-preview6']
    paths: ['haloryva-ci/preview6/src/**', 'haloryva-ci/preview6/assets/**', 'haloryva-ci/preview6/languages/**', 'haloryva-ci/preview6/Build-Preview6.ps1', 'haloryva-ci/preview6/source-origin.json', '.github/workflows/haloryva-preview6-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated localized preview
        shell: powershell
        run: ./haloryva-ci/preview6/Build-Preview6.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1-preview.6-build
          path: ${{ runner.temp }}/haloryva-preview6-build/
          retention-days: 30
          if-no-files-found: error
