name: Haloryva preview.9 read existing refresh trace only
on:
  push:
    branches: ['haloryva-tests-preview9']
    paths: ['.github/workflows/haloryva-preview9-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-existing:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview9-first-refocus-on
          run-id: 43030955991
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview9-existing-evidence/
      - name: Print preserved trace without executing Haloryva
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'preview9-existing-evidence'
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -File)
          $files|Select-Object Name,Length|ConvertTo-Json
          $files|Where-Object {$_.Name -eq 'startup-refresh-recipe.tsv' -or $_.Name -eq 'errors.log'}|ForEach-Object {Write-Output ('EVIDENCE-FILE '+$_.Name);Get-Content -LiteralPath $_.FullName -Encoding UTF8}
