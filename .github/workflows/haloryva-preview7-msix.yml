name: Haloryva preview.7 MSIX launch and persistence
on:
  push:
    branches: ['haloryva-tests-preview7-msix']
    paths: ['haloryva-ci/preview7-msix/**', '.github/workflows/haloryva-preview7-msix.yml']
permissions:
  contents: read
  actions: read
jobs:
  msix:
    name: Frozen preview.7 unsigned MSIX FR EN ES
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.7-build
          run-id: 42957075701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-build/
      - uses: actions/download-artifact@v4
        with:
          name: preview7-visual-fr-off-evidence
          run-id: 43001652792
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-native/fr/
      - uses: actions/download-artifact@v4
        with:
          name: preview7-visual-en-off-evidence
          run-id: 43001652792
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-native/en/
      - uses: actions/download-artifact@v4
        with:
          name: preview7-visual-es-off-evidence
          run-id: 43001652792
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview7-native/es/
      - name: Package, launch, verify language and saved tools, stop and remove
        shell: powershell
        run: ./haloryva-ci/preview7-msix/Run-Msix.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview7-msix-evidence
          path: ${{ runner.temp }}/haloryva-preview7-msix/
          retention-days: 30
