name: Haloryva preview.8 installed WinRT compiler preflight
on:
  push:
    branches: ['haloryva-tests-preview8']
    paths: ['haloryva-ci/preview8-preflight/**', '.github/workflows/haloryva-preview8-preflight.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./haloryva-ci/preview8-preflight/Check-References.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview8-compiler-preflight
          path: ${{ runner.temp }}/haloryva-preview8-preflight/
          retention-days: 30
