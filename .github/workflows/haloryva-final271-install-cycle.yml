name: Haloryva final 2.7.1 isolated install and uninstall
on:
  push:
    branches: ['haloryva-recette-installateur-final-2.7.1']
    paths: ['haloryva-ci/final271-install-cycle/**', '.github/workflows/haloryva-final271-install-cycle.yml']
permissions:
  contents: read
  actions: read
jobs:
  install-uninstall:
    runs-on: windows-11-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HaloryvaSetup-2.7.1-preuves-fabrication
          run-id: 43088395238
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/final271-frozen-installer/
      - name: Install and uninstall exact final setup with settings retained
        shell: powershell
        run: ./haloryva-ci/final271-install-cycle/Run-InstallCycle.ps1 -AuthorizedInstallCycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HaloryvaSetup-2.7.1-installation-desinstallation-preuves
          path: ${{ runner.temp }}/final271-install-cycle/
          retention-days: 90
          if-no-files-found: error
