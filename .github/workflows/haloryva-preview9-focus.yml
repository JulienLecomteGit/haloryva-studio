name: Haloryva preview.9 first Studio refocus
on:
  push:
    branches: ['haloryva-tests-preview9']
    paths: ['haloryva-ci/preview9-focus/**', '.github/workflows/haloryva-preview9-focus.yml']
permissions:
  contents: read
  actions: read
jobs:
  first-refocus:
    runs-on: windows-11-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        trace: ['on', 'off']
    name: First refocus trace ${{ matrix.trace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-preview9-msix-test
          run-id: 43030441632
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview9-msix/
      - name: First confirmed refocus on the frozen binary
        shell: powershell
        run: ./haloryva-ci/preview9-focus/Run-FirstRefocus.ps1 -TraceMode '${{ matrix.trace }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview9-first-refocus-${{ matrix.trace }}
          path: ${{ runner.temp }}/preview9-live-focus-${{ matrix.trace }}/
          retention-days: 30
