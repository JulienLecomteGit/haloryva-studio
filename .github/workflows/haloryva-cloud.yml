name: Haloryva hosted pilot
# This file is prepared locally only. Transfer requires user approval.
on:
  push:
    branches: ['haloryva-tests-preview2']
    paths: ['haloryva-ci/**', '.github/workflows/haloryva-cloud.yml']
permissions:
  contents: read
jobs:
  functional-x64:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Existing preview - functional pilot only
        shell: powershell
        run: ./haloryva-ci/Run-Cloud.ps1 -Mode functional
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-x64-evidence
          path: ${{ runner.temp }}/haloryva-functional/
          retention-days: 7
  msix-windows11:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned MSIX pilot on Windows 11 ARM - x64 emulation
        shell: powershell
        run: ./haloryva-ci/Run-Cloud.ps1 -Mode msix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-windows11-arm-evidence
          path: ${{ runner.temp }}/haloryva-msix/
          retention-days: 7
