name: Haloryva preview.8 targeted startup and migration checks
on:
  push:
    branches: ['haloryva-tests-preview8']
    paths: ['haloryva-ci/preview8-targeted/**', '.github/workflows/haloryva-preview8-targeted.yml']
permissions:
  contents: read
  actions: read
jobs:
  targeted:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Haloryva-2.7.1-preview.8-build
          run-id: 43012511350
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/haloryva-preview8-build/
      - name: Compile driver and run only isolated targeted checks
        shell: powershell
        run: ./haloryva-ci/preview8-targeted/Run-Targeted.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview8-targeted-evidence
          path: ${{ runner.temp }}/haloryva-preview8-targeted/
          retention-days: 30
