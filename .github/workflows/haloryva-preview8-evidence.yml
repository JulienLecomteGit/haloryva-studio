name: Haloryva preview.8 read existing MSIX diagnostics only
on:
  push:
    branches: ['haloryva-tests-preview8']
    paths: ['.github/workflows/haloryva-preview8-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview8-startup-ui-evidence
          run-id: 43015667946
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview8-existing-evidence/
      - name: Read existing text evidence without running Haloryva
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'preview8-existing-evidence'
          Get-ChildItem -LiteralPath $root -File | Where-Object {$_.Name -match '^(manifest-|windows-|opened-|final-)'} | ForEach-Object {
            Write-Output ('FILE: '+$_.Name)
            Get-Content -LiteralPath $_.FullName -Encoding UTF8
          }
