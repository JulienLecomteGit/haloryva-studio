name: Haloryva preview.9 startup refresh build
on:
  push:
    branches: ['haloryva-tests-preview9']
    paths: ['haloryva-ci/preview9/src/**', 'haloryva-ci/preview9/assets/**', 'haloryva-ci/preview9/languages/**', 'haloryva-ci/preview9/Build-Preview9.ps1', 'haloryva-ci/preview9/source-origin.json', '.github/workflows/haloryva-preview9-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated targeted preview
        shell: powershell
        run: ./haloryva-ci/preview9/Build-Preview9.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Haloryva-2.7.1-preview.9-build
          path: ${{ runner.temp }}/haloryva-preview9-build/
          retention-days: 30
          if-no-files-found: error
